<!DOCTYPE html>
<html>
<head>
    <title>Test Firebase</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js"></script>
</head>
<body>
    <h1>Firebase Test</h1>
    <div id="status">Testing...</div>
    
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA2fT5IjoIkmol4nufob-YSY3xbU5wV0UU",
            authDomain: "thuriya-online-newspaper.firebaseapp.com",
            projectId: "thuriya-online-newspaper",
            storageBucket: "thuriya-online-newspaper.appspot.com",
            messagingSenderId: "339188278267",
            appId: "1:339188278267:web:916881e3e9b7649d60a15e"
        };
        
        try {
            firebase.initializeApp(firebaseConfig);
            const db = firebase.firestore();
            
            db.collection('categories').limit(1).get()
                .then(snapshot => {
                    document.getElementById('status').innerHTML = 
                        '✅ SUCCESS! Found ' + snapshot.size + ' categories';
                    document.body.style.background = '#d4ffd4';
                })
                .catch(error => {
                    document.getElementById('status').innerHTML = 
                        '❌ ERROR: ' + error.code + ' - ' + error.message;
                    document.body.style.background = '#ffd4d4';
                });
        } catch (error) {
            document.getElementById('status').innerHTML = '❌ Init Error: ' + error.message;
            document.body.style.background = '#ffd4d4';
        }
    </script>
</body>
</html>
